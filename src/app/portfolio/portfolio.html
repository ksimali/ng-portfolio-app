<div class="container">

    <!-- Filter section -->
    <div class="mb-2">
        <div>
            <button class="btn btn-outline-primary mb-2 me-2" (click)="isCollapsed = !isCollapsed">Filter</button>
            <button class="btn btn-outline-secondary mb-2" (click)="resetFilters()" [hidden]="!filtering">Reset</button>
        </div>

        <!--content hide or display depending on isCollapsed value-->
        <div [collapse]="isCollapsed" [isAnimated]="true">
            <div class="border mb-2 shadow-sm" style="width: 250px">
                <form>
                    <div class="row mx-0">
                        <!-- Backend options -->
                        <div class="col">
                            <small><b>Backend</b></small>
                            <div class="form-group">
                                <div class="form-check">
                                   <input 
                                        type="checkbox" 
                                        class="form-check-input position-static me-2"
                                        [(ngModel)]="springboot"
                                        (change)="filter()"
                                        name="springboot"> 
                                   <label class="form-check-label small">Springboot</label>
                                </div>
                                <div class="form-check">
                                    <input 
                                         type="checkbox" 
                                         class="form-check-input position-static me-2"
                                         [(ngModel)]="nodejs"
                                         (change)="filter()"
                                         name="nodejs"> 
                                    <label class="form-check-label small">Nodejs</label>
                                 </div>
                                 <div class="form-check">
                                    <input 
                                         type="checkbox" 
                                         class="form-check-input position-static me-2"
                                         [(ngModel)]="expressjs"
                                         (change)="filter()"
                                         name="expressjs"> 
                                    <label class="form-check-label small">Expressjs</label>
                                 </div>
                                 <div class="form-check">
                                    <input 
                                         type="checkbox" 
                                         class="form-check-input position-static me-2"
                                         [(ngModel)]="django"
                                         (change)="filter()"
                                         name="django"> 
                                    <label class="form-check-label small">Django</label>
                                 </div>
                                 <!-- Framework a exclure présentement, skills encore leger 
                                 <div class="form-check">
                                    <input 
                                         type="checkbox" 
                                         class="form-check-input position-static me-2"
                                         [(ngModel)]="aspnet"
                                         (change)="filter()"
                                         name="aspnet"> 
                                    <label class="form-check-label small">Aspnet</label>
                                 </div>
                                 -->
                            </div>
                        </div>

                        <!-- Framework options -->
                        <div class="col">
                            <small><b>FrontEnd</b></small>
                            <div class="form-group">
                                <div class="form-check">
                                   <input 
                                        type="checkbox" 
                                        class="form-check-input position-static me-2"
                                        [(ngModel)]="angular"
                                        (change)="filter()"
                                        name="Angular"> 
                                   <label class="form-check-label small">Angular</label>
                                </div>
                                <div class="form-check">
                                    <input 
                                         type="checkbox" 
                                         class="form-check-input position-static me-2"
                                         [(ngModel)]="react"
                                         (change)="filter()"
                                         name="react"> 
                                    <label class="form-check-label small">React</label>
                                </div>
                                <div class="form-check">
                                    <input 
                                         type="checkbox" 
                                         class="form-check-input position-static me-2"
                                         [(ngModel)]="javascript"
                                         (change)="filter()"
                                         name="javascipt"> 
                                    <label class="form-check-label small">Javascript</label>
                                </div>                        
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- projects section -->
    <div class="row">
        <div *ngFor="let project of projects" class="col-lg-4 col-md-6 mb-4" style="max-width: 380px; min-width: 380px;">
            <app-project-card [project]="project"></app-project-card>
        </div>
        
    </div>
    
</div>
